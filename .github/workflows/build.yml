name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.github/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  automation-tests:
    name: Automation tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.channel.outputs.matrix }}
      configuration: ${{ steps.channel.outputs.configuration }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test .github/scripts/automation.test.cjs
      - name: Select build and release channel
        id: channel
        run: node .github/scripts/release-channel.cjs

  build:
    name: Build (${{ matrix.configuration }})
    needs: automation-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.automation-tests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare build metadata
        shell: pwsh
        env:
          BUILD_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.CLIENT_ID || '' }}
          BUILD_CURSEFORGE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CURSEFORGE_API_KEY || '' }}
        run: ./.github/scripts/prepare-build.ps1
      - name: Synchronize tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: node .github/scripts/stamp-version.cjs
      - name: Restore packages
        run: dotnet restore PCLCS/PCLCS.csproj
      - name: Build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: msbuild 'Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj' -p:Configuration=$env:CONFIGURATION
      - name: Package and checksum
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'Plain Craft Launcher 2/bin/Plain Craft Launcher Slash.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Build output is missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $archive = "dist/PCL-Slash-$version-$env:CONFIGURATION-windows.zip"
          Compress-Archive -LiteralPath $exe, 'README.md' -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $([IO.Path]::GetFileName($archive))"
          [IO.File]::WriteAllText("$archive.sha256", $checksum + "`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7
        with:
          name: PCL-Slash-${{ matrix.configuration }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [automation-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: PCL-Slash-${{ needs.automation-tests.outputs.configuration }}
          path: release-assets
      - name: Generate notes from commits
        run: node .github/scripts/release-notes.cjs
      - name: Create draft and attach packages
        uses: actions/github-script@v9
        with:
          script: |
            const updateDraft = require('./.github/scripts/update-draft-release.cjs');
            await updateDraft({ github, context, core });
